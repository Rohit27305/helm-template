{{- range .Values.apps }}
{{- if .app }}
{{- $app := . }}
{{- $slots := list "" }}
{{- if and .blueGreen .blueGreen.enabled }}
  {{- $slots = list "blue" "green" }}
{{- end }}

{{- range $slot := $slots }}
{{- $name := $app.name }}
{{- $tag := $app.tag }}
{{- if $slot }}
  {{- $name = printf "%s-%s" $app.name $slot }}
  {{- $tag = index $app.blueGreen $slot "tag" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $app.namespace | default $.Values.global.namespace }}
  labels:
    {{- include "appshpere.labels" $ | nindent 4 }}
    app: {{ $app.app }}
    {{- if $slot }}
    slot: {{ $slot }}
    {{- end }}
spec:
  replicas: {{ $app.replicas | default 1 }}
  strategy:
    {{- if $app.strategy }}
    {{- toYaml $app.strategy | nindent 4 }}
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/name: {{ $name }}-pod
    spec:
      {{- if $app.podSecurityContext }}
      securityContext:
        {{- toYaml $app.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $app.name }}
          image: "{{ $.Values.global.image.registry }}/{{ $.Values.global.image.repository }}/{{ $app.imageName }}:{{ $tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          {{- if $app.ports }}
          ports:
            - containerPort: {{ $app.ports.targetPort | default $app.ports.port }}
              name: http-port
              protocol: TCP
            {{- if $app.ports.grpcPort }}
            - containerPort: {{ $app.ports.grpcPort }}
              name: grpc-port
              protocol: TCP
            {{- end }}
          {{- end }}
          {{- if $app.env }}
          env:
            {{- toYaml $app.env | nindent 12 }}
          {{- end }}
          {{- if $app.envFrom }}
          envFrom:
            {{- toYaml $app.envFrom | nindent 12 }}
          {{- end }}
          {{- if $app.resources }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          {{- end }}
          {{- if $app.livenessProbe }}
          livenessProbe:
            {{- toYaml $app.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $app.readinessProbe }}
          readinessProbe:
            {{- toYaml $app.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $app.startupProbe }}
          startupProbe:
            {{- if and $app.startupProbe.httpGet $app.startupProbe.httpGet.path }}
            httpGet:
              path: "{{ $app.startupProbe.httpGet.path }}"
              port: {{ $app.startupProbe.httpGet.port | default 80 }}
              scheme: {{ $app.startupProbe.httpGet.scheme | default "HTTP" | quote }}
            {{- else }}
            exec:
              command: ["true"]
            {{- end }}
            initialDelaySeconds: {{ $app.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $app.startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $app.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ $app.startupProbe.failureThreshold | default 3 }}
          {{- end }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}