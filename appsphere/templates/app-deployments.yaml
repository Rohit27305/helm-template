{{- range .Values.apps }}
{{- if .app }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Values.global.namespace }}
  labels:
    {{- include "appshpere.labels" $ | nindent 4 }}
    app: {{ .app }}
spec:
  replicas: {{ .replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        app.kubernetes.io/name: {{ .name }}-pod
    spec:
      {{- if .nodeSelector }}
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .affinity }}
      affinity:
        {{- toYaml .affinity | nindent 8 }}
      {{- end }}
      {{- if .tolerations }}
      tolerations:
        {{- toYaml .tolerations | nindent 8 }}
      {{- end }}
      {{- if .podSecurityContext }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.global.image.registry }}/{{ $.Values.global.image.repository }}/{{ .imageName }}:{{ .tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          {{- if .securityContext }}
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          {{- end }}
          {{- if .command }}
          command: [{{- range $index, $elem := .command }}{{ if $index }}, {{ end }}"{{ $elem }}"{{- end }}]
          {{- end }}
          {{- if .ports }}
          ports:
            - containerPort: {{ .ports.targetPort | default .ports.port }}
              name: http-port
              protocol: TCP
            {{- if .ports.grpcPort }}
            - containerPort: {{ .ports.grpcPort }}
              name: grpc-port
              protocol: TCP
            {{- end }}
          {{- end }}
          {{- if .env }}
          env:
            {{- toYaml .env | nindent 12 }}
          {{- end }}
          {{- if .envFrom }}
          envFrom:
            {{- toYaml .envFrom | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          {{- if .resources.enabled }}
          resources:
            {{- if .resources.requests }}
            requests:
              {{- toYaml .resources.requests | nindent 14 }}
            {{- end }}
            {{- if .resources.limits }}
            limits:
              {{- toYaml .resources.limits | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if .livenessProbe }}
          livenessProbe:
            {{- toYaml .livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .readinessProbe }}
          readinessProbe:
            {{- toYaml .readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .startupProbe }}
          startupProbe:
            {{- if and .startupProbe.httpGet .startupProbe.httpGet.path }}
            httpGet:
              path: "{{ .startupProbe.httpGet.path }}"
              port: {{ .startupProbe.httpGet.port | default 80 }}
              scheme: {{ .startupProbe.httpGet.scheme | default "HTTP" | quote }}
            {{- else }}
            exec:
              command: ["true"]
            {{- end }}
            initialDelaySeconds: {{ .startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .startupProbe.failureThreshold | default 3 }}
          {{- end }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
{{- end }}
{{- end }}