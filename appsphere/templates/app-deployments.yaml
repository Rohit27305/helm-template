{{- range .Values.apps }}
{{- if .app }}
{{- $app := . }}
{{- $slots := list "default" }}
{{- if and .blueGreen .blueGreen.enabled }}
  {{- $slots = list "blue" "green" }}
{{- end }}

{{- range $slot := $slots }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ if eq $slot "default" }}{{ $app.name }}{{ else }}{{ $app.name }}-{{ $slot }}{{ end }}
  namespace: {{ $app.namespace | default $.Values.global.namespace }}
  labels:
    {{- include "appshpere.labels" $ | nindent 4 }}
    app: {{ $app.app }}
    {{- if ne $slot "default" }}
    slot: {{ $slot }}
    {{- end }}
spec:
  replicas: {{ $app.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ $app.name }}
      {{- if ne $slot "default" }}
      slot: {{ $slot }}
      {{- end }}
  template:
    metadata:
      labels:
        app: {{ $app.name }}
        {{- if ne $slot "default" }}
        slot: {{ $slot }}
        {{- end }}
        app.kubernetes.io/name: {{ $app.name }}-pod
    spec:
      {{- if $app.nodeSelector }}
      nodeSelector:
        {{- toYaml $app.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $app.affinity }}
      affinity:
        {{- toYaml $app.affinity | nindent 8 }}
      {{- end }}
      {{- if $app.tolerations }}
      tolerations:
        {{- toYaml $app.tolerations | nindent 8 }}
      {{- end }}
      {{- if $app.podSecurityContext }}
      securityContext:
        {{- toYaml $app.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $app.name }}
          image: "{{ $.Values.global.image.registry }}/{{ $.Values.global.image.repository }}/{{ $app.imageName }}:{{ if eq $slot "blue" }}{{ $app.blueGreen.blue.tag }}{{ else if eq $slot "green" }}{{ $app.blueGreen.green.tag }}{{ else }}{{ $app.tag }}{{ end }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          {{- if $app.securityContext }}
          securityContext:
            {{- toYaml $app.securityContext | nindent 12 }}
          {{- end }}
          {{- if $app.command }}
          command: [{{- range $index, $elem := $app.command }}{{ if $index }}, {{ end }}"{{ $elem }}"{{- end }}]
          {{- end }}
          {{- if $app.ports }}
          ports:
            - containerPort: {{ $app.ports.targetPort | default $app.ports.port }}
              name: http-port
              protocol: TCP
            {{- if $app.ports.grpcPort }}
            - containerPort: {{ $app.ports.grpcPort }}
              name: grpc-port
              protocol: TCP
            {{- end }}
          {{- end }}
          {{- if $app.env }}
          env:
            {{- toYaml $app.env | nindent 12 }}
          {{- end }}
          {{- if $app.envFrom }}
          envFrom:
            {{- toYaml $app.envFrom | nindent 12 }}
          {{- end }}
          {{- if $app.resources }}
          {{- if $app.resources.enabled }}
          resources:
            {{- if $app.resources.requests }}
            requests:
              {{- toYaml $app.resources.requests | nindent 14 }}
            {{- end }}
            {{- if $app.resources.limits }}
            limits:
              {{- toYaml $app.resources.limits | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if $app.livenessProbe }}
          livenessProbe:
            {{- toYaml $app.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $app.readinessProbe }}
          readinessProbe:
            {{- toYaml $app.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $app.startupProbe }}
          startupProbe:
            {{- if and $app.startupProbe.httpGet $app.startupProbe.httpGet.path }}
            httpGet:
              path: "{{ $app.startupProbe.httpGet.path }}"
              port: {{ $app.startupProbe.httpGet.port | default 80 }}
              scheme: {{ $app.startupProbe.httpGet.scheme | default "HTTP" | quote }}
            {{- else }}
            exec:
              command: ["true"]
            {{- end }}
            initialDelaySeconds: {{ $app.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $app.startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $app.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ $app.startupProbe.failureThreshold | default 3 }}
          {{- end }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}