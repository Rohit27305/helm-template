{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: nginx
  listeners:
{{- range .Values.gateway.listeners }}
    - name: {{ .host | replace "." "-" }}
      hostname: {{ .host | quote }}
      port: {{ .port }}
      protocol: {{ .protocol }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .tls }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
{{- end }}
