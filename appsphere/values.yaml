# Global Configuration
global:
  namespace: demo
  image:
    registry: docker.io
    repository: rohitmakunai
    pullPolicy: Always
  imagePullSecrets: []

# Application Configuration
apps:
  demo:
    name: demo
    replicas: 1

    # Image
    imageName: test
    tag: blue     # if blueGreen is not available or disabled

    # Blue Green
    blueGreen:
      enabled: true
      blue:
        tag: blue
      green:
        tag: green


    # Ports
    ports:
      port: 80
      targetPort: 80
      # nodePort: 30080
      # grpcPort: 50051
      # grpcTargetPort: 50051
      # grpcNodePort: 31425

    # Environment
    envFrom: []
    env: []
    command: []

    # Probes
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    startupProbe:
      enabled: false
      failureThreshold: 30
      periodSeconds: 10
      initialDelaySeconds: 10
      timeoutSeconds: 5
      httpGet:
        path: /
        port: 80

    # Resources
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

    # Scheduling
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Service
    service:
      type: NodePort

    # HPA
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80

    # PDB
    pdb:
      enabled: true
      minAvailable: 1


  test2:
    name: test2
    replicas: 1

    # Image
    imageName: test
    tag: blue     # if blueGreen is not available or disabled

    # Ports
    ports:
      port: 80
      targetPort: 80

    # Resources
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"


# Gateway Configuration
gateway: 
  enabled: true
  name: gateway

  clientSettings:
    name: gateway-client-settings
    maxSize: "50"

  listeners:
    - host: test-bg.makunaiglobal.ai
      tls: tls-secret
      sslRedirect: true
      routes:
        - path: /grpc
          pathType: PathPrefix
          backendRefs:
            - name: demo-blue
              port: 50051
              weight: 100
            - name: demo-green
              port: 50051
              weight: 0
        - path: /
          pathType: PathPrefix
          backendRefs:
            - name: demo-blue
              port: 80
              weight: 100
            - name: demo-green
              port: 80
              weight: 0

# RBAC Configuration
rbac:
  enabled: true
  serviceAccountName: rbac-sa
  roleName: rbac-role
  roleBindingName: rbac-binding
  tokenSecretName: rbac-token
  group: devusers
