# Global Configuration
global:
  namespace: demo
  image:
    registry: docker.io
    repository: rohitmakunai
    pullPolicy: Always
  imagePullSecrets: []

# Application Configuration
apps:
  - name: test-blue
    namespace: demo
    app: test
    replicas: 1

    # Image
    imageName: test
    tag: blue  

    # Ports
    ports:
      port: 80
      targetPort: 80
      nodePort: 30080
      grpcPort: 50051
      grpcTargetPort: 50051
      grpcNodePort: 31425

    # Environment
    envFrom: []
    env: []
    command: []

    # Probes
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    startupProbe:
      enabled: false
      failureThreshold: 30
      periodSeconds: 10
      initialDelaySeconds: 10
      timeoutSeconds: 5
      httpGet:
        path: /
        port: 80

    # Resources
    resources:
      enabled: true
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

    # # Security Context
    # podSecurityContext:
    #   runAsUser: 1000
    #   runAsGroup: 3000
    #   fsGroup: 2000
    # securityContext:
    #   capabilities:
    #     drop:
    #     - ALL
    #   readOnlyRootFilesystem: true
    #   runAsNonRoot: true
    #   allowPrivilegeEscalation: false
    
    # Scheduling
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Service
    service:
      type: NodePort

    # HPA
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80

    # PDB
    pdb:
      enabled: true
      minAvailable: 1

  - name: test-green 
    namespace: demo
    ports:
      port: 80
      targetPort: 80
    app: test
    replicas: 1
    imageName: test
    tag: green  
    envFrom: []
    env: []
    command:
    startupProbe:
      enabled: false
    resources:
      enabled: false
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    service:
      type: ClusterIP
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80

# Gateway Configuration
gateway: 
  enabled: true
  name: demo-gateway
  namespace: demo

  listeners:
    - host: test-bg.makunaiglobal.ai
      tls: tls-secret
      routes:
        - path: /grpc
          pathType: PathPrefix
          backend:
            service: test-blue
            port: 50051
        - path: /
          pathType: PathPrefix
          backend:
            service: test-blue
            port: 80
          filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301                    
    - host: test-2.makunaiglobal.ai
      tls: tls-secret
      routes:
        - path: /
          pathType: PathPrefix
          backend:
            service: test-green
            port: 80

# RBAC Configuration
rbac:
  enabled: true
  serviceAccountName: rbac-sa
  roleName: rbac-role
  roleBindingName: rbac-binding
  tokenSecretName: rbac-token
  group: devusers
